name: orcafacil_pro
description: "Aplicativo de Gestão Financeira, Orçamentos e Agendamentos para Profissionais."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Biblioteca padrão de ícones do Material Design
  cupertino_icons: ^1.0.6

  # Biblioteca para abrir o WhatsApp e links externos
  url_launcher: ^6.2.5

  # Persistência de dados local no aparelho do usuário final
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0

  # Gerador automático do ícone do aplicativo para Android e iOS
  flutter_launcher_icons: "^0.13.1"

# Configuração do gerador de ícone do app
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon_app.png"

flutter:
  uses-material-design: true

  # Definição de assets e imagens do aplicativo
  assets:
    - assets/